<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>抖音</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="mask"></div>
<video id="va"></video>
<div id="cover"><div class="img"></div></div>

<div id="info">
  <div id="author"></div>
  <div id="desc"></div>
  <div id="stats"><span id="act-like" class="act"></span><span id="act-collect" class="act"></span><span id="act-comment" class="act"></span><span id="act-mix" class="act"></span></div>
  <div id="time"></div>
  <div id="hint"></div>
</div>
<div id="tabs"></div>

<div id="login">
  <div id="login-title"></div>
  <div class="qr-box"><img id="qr" alt=""></div>
  <div id="login-msg"></div>
  <div class="hint">左右键切换标签</div>
</div>
<div id="grid-page">
  <div id="gp-scroll">
    <img id="gp-avatar" alt="">
    <div id="gp-name"></div>
    <div id="gp-stats"></div>
    <div id="gp-sign"></div>
    <div id="gp-tabs"></div>
    <div id="gp-grid"></div>
    <div id="gp-foot"></div>
  </div>
</div>
<div id="comments">
  <div id="cm-title"></div>
  <div id="cm-view"><div id="cm-list"></div></div>
  <div id="cm-hint">上下键翻 · 确认键展开回复 · 返回键关掉</div>
</div>
<div id="empty">
  <div id="empty-msg"></div>
  <div class="hint">按确认键重试，左右键切换标签</div>
</div>

<div id="progress"><div id="bar"></div></div>
<div id="paused">❚❚</div>
<div id="loading"><div class="dot a"></div><div class="dot b"></div><div class="label">正在加载…</div></div>
<div id="toast"></div>

<!-- 只有两个标签。其余由 boot.js 写：安装包自己的脚本，或者自动更新下载、验过签名的新版本（它的 SCRIPTS 才是
     现在的加载顺序，新加的文件加在那里，不是这里）。config.js 留在外面：deploy.sh 改写它，更新永远不带它。 -->
<script src="js/config.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
